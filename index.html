<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>May tinh ma cyclic GF(2)</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --warn: #b45309;
      --bad: #b91c1c;
      --good-bg: #ecfdf5;
      --soft: #eef2f7;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(330px, 420px) 1fr;
    }

    aside {
      background: #17202a;
      color: #eef2f7;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    main {
      padding: 28px;
      overflow: auto;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.12;
    }

    h2 {
      font-size: 19px;
      margin-bottom: 14px;
    }

    h3 {
      font-size: 15px;
      margin-bottom: 10px;
    }

    p {
      margin: 0;
      line-height: 1.55;
    }

    .subtitle {
      color: #b7c1d1;
      max-width: 34rem;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: inherit;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
      outline: none;
    }

    aside textarea,
    aside input,
    aside select {
      border-color: #314052;
      background: #101820;
      color: #f8fafc;
    }

    textarea {
      min-height: 112px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.45;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.18);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      background: #101820;
      border: 1px solid #314052;
      border-radius: 10px;
    }

    .segmented button,
    .mode button {
      border: 0;
      cursor: pointer;
      border-radius: 7px;
      padding: 10px 8px;
      font-weight: 750;
      color: #cbd5e1;
      background: transparent;
      min-height: 40px;
    }

    .segmented button.active,
    .mode button.active {
      background: #f8fafc;
      color: #0f172a;
    }

    .mode {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 5px;
      background: #101820;
      border: 1px solid #314052;
      border-radius: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
      border: 0;
      cursor: pointer;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 14px;
      font-weight: 800;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-strong);
    }

    .secondary {
      background: #263445;
      color: #f8fafc;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 86px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 21px;
      line-height: 1.1;
      word-break: break-word;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tabs button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      min-height: 38px;
      padding: 0 12px;
      cursor: pointer;
      font-weight: 750;
      color: var(--ink);
    }

    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .solution {
      display: grid;
      gap: 14px;
    }

    .step {
      border-left: 4px solid var(--accent);
      background: #f8fafc;
      padding: 14px 14px 14px 16px;
      border-radius: 0 8px 8px 0;
    }

    .step p + p {
      margin-top: 8px;
    }

    .notice {
      border: 1px solid #f3d5a6;
      background: #fff7ed;
      color: var(--warn);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .error {
      border-color: #fecaca;
      background: #fef2f2;
      color: var(--bad);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--soft);
    }

    .mcq-list {
      display: grid;
      gap: 12px;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .choice {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: break-word;
    }

    .choice.correct {
      background: var(--good-bg);
      border-color: #34d399;
      font-weight: 800;
    }

    .answer-key {
      margin-top: 14px;
      background: #f8fafc;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    .raw-output {
      white-space: pre-wrap;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
    }


    .latex-output {
      width: 100%;
      min-height: 360px;
      white-space: pre;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.45;
    }

    @media (max-width: 940px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        padding: 22px;
      }

      main {
        padding: 20px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid-2,
      .summary,
      .choices {
        grid-template-columns: 1fr;
      }

      .segmented {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>May tinh ma cyclic GF(2)</h1>
        <p class="subtitle">Nhap dung input chuan nhu chuong trinh C++: dong dau la <span class="mono">n k</span>, dong sau la chuoi nhi phan cua <span class="mono">h(x)</span>.</p>
      </div>

      <div class="field">
        <label for="standardInput">Input chuan</label>
        <textarea id="standardInput" spellcheck="false">7 3
1011</textarea>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="nValue">n</label>
          <input id="nValue" inputmode="numeric" value="7">
        </div>
        <div class="field">
          <label for="kValue">k</label>
          <input id="kValue" inputmode="numeric" value="3">
        </div>
      </div>

      <div class="field">
        <label for="hValue">h(x) dang nhi phan</label>
        <input id="hValue" value="1011" spellcheck="false">
      </div>

      <div class="field">
        <label>Che do nhap</label>
        <div class="segmented" id="inputMode">
          <button type="button" class="active" data-mode="standard">Chuan</button>
          <button type="button" data-mode="fields">Tach o</button>
          <button type="button" data-mode="example">Vi du</button>
        </div>
      </div>

      <div class="field">
        <label>Dang ket qua</label>
        <div class="mode" id="outputMode">
          <button type="button" class="active" data-mode="solution">Tu luan</button>
          <button type="button" data-mode="mcq">Trac nghiem</button>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="solveButton" type="button">Tinh ket qua</button>
        <button class="secondary" id="copyButton" type="button">Chep output</button>
        <button class="secondary" id="latexButton" type="button">Chep LaTeX</button>
      </div>
    </aside>

    <main>
      <section id="result"></section>
    </main>
  </div>

  <script>
    const inf = 1000000000;
    const letters = ["A", "B", "C", "D"];
    const examples = [
      "7 3\n1011",
      "15 5\n101001",
      "7 4\n101"
    ];

    let currentInputMode = "standard";
    let currentOutputMode = "solution";
    let lastPlainOutput = "";
    let lastLatexOutput = "";

    class Polynomial {
      constructor(coefficients = [0]) {
        this.coefficients = coefficients.map(Number);
        this.normalize();
      }

      normalize() {
        while (this.coefficients.length > 1 && this.coefficients[this.coefficients.length - 1] === 0) {
          this.coefficients.pop();
        }
        if (this.coefficients.length === 0) this.coefficients = [0];
      }

      isZero() {
        return this.coefficients.length === 1 && this.coefficients[0] === 0;
      }

      degree() {
        return this.isZero() ? -1 : this.coefficients.length - 1;
      }

      coefficient(i) {
        return i < 0 || i >= this.coefficients.length ? 0 : this.coefficients[i];
      }

      weight() {
        return this.coefficients.reduce((sum, x) => sum + x, 0);
      }

      binary(length = -1) {
        let d = this.degree();
        if (length !== -1) d = length - 1;
        if (d < 0) return "0";
        let text = "";
        for (let i = d; i >= 0; i--) text += String(this.coefficient(i));
        return text;
      }

      display() {
        if (this.isZero()) return "0";
        const terms = [];
        for (let i = this.degree(); i >= 0; i--) {
          if (!this.coefficient(i)) continue;
          if (i === 0) terms.push("1");
          else if (i === 1) terms.push("x");
          else terms.push("x^" + i);
        }
        return terms.join(" + ");
      }

      clone() {
        return new Polynomial([...this.coefficients]);
      }

      static fromBinaryString(input) {
        const bits = String(input).trim().replace(/\s+/g, "");
        const coefficients = [];
        for (let i = bits.length - 1; i >= 0; i--) {
          if (bits[i] === "0" || bits[i] === "1") coefficients.push(Number(bits[i]));
        }
        if (coefficients.length === 0) coefficients.push(0);
        return new Polynomial(coefficients);
      }

      static fromMask(mask, k) {
        const coefficients = Array(Math.max(1, k)).fill(0);
        for (let i = 0; i < k; i++) coefficients[i] = Number((mask >> BigInt(i)) & 1n);
        return new Polynomial(coefficients);
      }

      static xPowerNPlusOne(n) {
        const coefficients = Array(n + 1).fill(0);
        coefficients[0] = 1;
        coefficients[n] = 1;
        return new Polynomial(coefficients);
      }
    }

    function addPoly(a, b) {
      const length = Math.max(a.coefficients.length, b.coefficients.length);
      const coefficients = Array(length).fill(0);
      for (let i = 0; i < length; i++) coefficients[i] = a.coefficient(i) ^ b.coefficient(i);
      return new Polynomial(coefficients);
    }

    function multiplyPoly(a, b) {
      if (a.isZero() || b.isZero()) return new Polynomial();
      const coefficients = Array(a.degree() + b.degree() + 1).fill(0);
      for (let i = 0; i <= a.degree(); i++) {
        if (!a.coefficient(i)) continue;
        for (let j = 0; j <= b.degree(); j++) {
          if (b.coefficient(j)) coefficients[i + j] ^= 1;
        }
      }
      return new Polynomial(coefficients);
    }

    function divideWithRemainder(f, g) {
      if (g.isZero()) return { quotient: new Polynomial(), remainder: f.clone(), steps: [] };
      const quotient = Array(Math.max(1, f.degree() - g.degree() + 1)).fill(0);
      const remainder = f.clone();
      const steps = [];

      while (!remainder.isZero() && remainder.degree() >= g.degree()) {
        const shift = remainder.degree() - g.degree();
        quotient[shift] ^= 1;
        const before = remainder.display();
        while (remainder.coefficients.length < shift + g.coefficients.length) {
          remainder.coefficients.push(0);
        }
        for (let i = 0; i < g.coefficients.length; i++) remainder.coefficients[i + shift] ^= g.coefficients[i];
        remainder.normalize();
        steps.push({
          shift,
          subtract: new Polynomial(Array(shift).fill(0).concat(g.coefficients)).display(),
          before,
          after: remainder.display()
        });
      }

      return { quotient: new Polynomial(quotient), remainder, steps };
    }

    function parseStandardInput(text) {
      const tokens = text.trim().split(/\s+/).filter(Boolean);
      if (tokens.length < 3) throw new Error("Input chuan can co n, k va chuoi h(x).");
      return {
        n: Number(tokens[0]),
        k: Number(tokens[1]),
        hText: tokens[2]
      };
    }

    function readInput() {
      if (currentInputMode === "fields") {
        return {
          n: Number(document.getElementById("nValue").value.trim()),
          k: Number(document.getElementById("kValue").value.trim()),
          hText: document.getElementById("hValue").value.trim()
        };
      }
      return parseStandardInput(document.getElementById("standardInput").value);
    }

    function validateInput({ n, k, hText }) {
      if (!Number.isInteger(n) || !Number.isInteger(k)) throw new Error("n va k phai la so nguyen.");
      if (n <= 0) throw new Error("n phai lon hon 0.");
      if (k < 0) throw new Error("k khong duoc am.");
      if (!/^[01]+$/.test(hText)) throw new Error("h(x) chi duoc gom cac ky tu 0 va 1.");
    }

    function solve(input) {
      validateInput(input);
      const h = Polynomial.fromBinaryString(input.hText);
      const xnPlusOne = Polynomial.xPowerNPlusOne(input.n);
      const division = divideWithRemainder(xnPlusOne, h);
      const g = division.quotient;
      const warnings = [];

      if (h.degree() !== input.k) warnings.push("Bac cua h(x) khac k.");
      if (g.degree() !== input.n - input.k) warnings.push("Bac cua g(x) khac n - k.");

      const result = {
        ...input,
        h,
        xnPlusOne,
        g,
        remainder: division.remainder,
        divisionSteps: division.steps,
        warnings,
        valid: division.remainder.isZero(),
        minDistance: null,
        detectableErrors: null,
        correctableErrors: null,
        smallestCodeword: null,
        enumeratedCount: 0
      };

      if (!result.valid) return result;
      if (input.k >= 63) throw new Error("k qua lon.");
      if (input.k > 25) throw new Error("k qua lon cho cach duyet toan bo tu ma.");

      let minDistance = inf;
      let smallestCodeword = new Polynomial();
      const limit = 1n << BigInt(input.k);
      for (let mask = 1n; mask < limit; mask++) {
        const message = Polynomial.fromMask(mask, input.k);
        const codeword = multiplyPoly(message, g);
        const weight = codeword.weight();
        if (weight < minDistance) {
          minDistance = weight;
          smallestCodeword = codeword;
        }
      }

      result.minDistance = minDistance;
      result.detectableErrors = minDistance - 1;
      result.correctableErrors = Math.floor((minDistance - 1) / 2);
      result.smallestCodeword = smallestCodeword;
      result.enumeratedCount = Number(limit - 1n);
      return result;
    }

    function plainOutput(r) {
      const lines = [
        "do_dai_ma = " + r.n,
        "so_bit_thong_tin = " + r.k,
        "h(x) = " + r.h.display()
      ];
      if (!r.valid) {
        lines.push("khong_hop_le");
        lines.push("ly_do = h(x) khong chia het x^n + 1");
        return lines.join("\n");
      }
      lines.push("g(x) = " + r.g.display());
      r.warnings.forEach(w => lines.push("canh_bao = " + w));
      lines.push("khoang_cach_ma_toi_thieu = " + r.minDistance);
      lines.push("so_loi_phat_hien_duoc = " + r.detectableErrors);
      lines.push("so_loi_sua_duoc = " + r.correctableErrors);
      lines.push("tu_ma_co_trong_so_nho_nhat = " + r.smallestCodeword.binary(r.n));
      return lines.join("\n");
    }

    function latexEscape(value) {
      return String(value).replace(/[\\_%&#${}^~]/g, ch => {
        switch (ch) {
          case "\\": return String.raw`\textbackslash{}`;
          case "_": return String.raw`\_`;
          case "%": return String.raw`\%`;
          case "&": return String.raw`\&`;
          case "#": return String.raw`\#`;
          case "$": return String.raw`\$`;
          case "{": return String.raw`\{`;
          case "}": return String.raw`\}`;
          case "^": return String.raw`\textasciicircum{}`;
          case "~": return String.raw`\textasciitilde{}`;
          default: return ch;
        }
      });
    }

    function latexPoly(poly) {
      if (poly.isZero()) return "0";
      const terms = [];
      for (let i = poly.degree(); i >= 0; i--) {
        if (!poly.coefficient(i)) continue;
        if (i === 0) terms.push("1");
        else if (i === 1) terms.push("x");
        else terms.push("x^{" + i + "}");
      }
      return terms.join(" + ");
    }

    function latexSolution(r) {
      if (!r.valid) {
        return String.raw`\section*{Loi giai ma cyclic}

Voi $n = ${r.n}$, $k = ${r.k}$ va:
\[
h(x) = ${latexPoly(r.h)}
\]

Ta co:
\[
x^n + 1 = ${latexPoly(r.xnPlusOne)}
\]

Chia $x^n + 1$ cho $h(x)$ thu duoc so du:
\[
${latexPoly(r.remainder)}
\]

Vi so du khac $0$ nen $h(x)$ khong chia het $x^n + 1$. Do do bo tham so da nhap khong hop le.`.trim();
      }

      return String.raw`\section*{Loi giai ma cyclic}

Voi $n = ${r.n}$, $k = ${r.k}$ va:
\[
h(x) = ${latexPoly(r.h)}
\]

Ta co:
\[
x^n + 1 = ${latexPoly(r.xnPlusOne)}
\]

Chia $x^n + 1$ cho $h(x)$:
\[
g(x) = \frac{x^n + 1}{h(x)} = ${latexPoly(r.g)}
\]

Suy ra da thuc sinh cua ma cyclic la:
\[
g(x) = ${latexPoly(r.g)}
\]

Kiem tra bac da thuc:
\[
\deg h(x) = ${r.h.degree()}, \qquad \deg g(x) = ${r.g.degree()}
\]

Khoang cach ma toi thieu:
\[
d_{min} = ${r.minDistance}
\]

So loi phat hien duoc:
\[
d_{min} - 1 = ${r.detectableErrors}
\]

So loi sua duoc:
\[
\left\lfloor \frac{d_{min} - 1}{2} \right\rfloor = ${r.correctableErrors}
\]

Tu ma co trong so Hamming nho nhat la:
\[
${r.smallestCodeword.binary(r.n)}
\]`.trim();
    }

    function latexMcq(r) {
      const questions = mcqQuestions(r);
      let text = String.raw`\section*{Cau hoi trac nghiem}` + "\n\n";
      text += String.raw`\begin{enumerate}` + "\n";

      questions.forEach(q => {
        text += `  ${String.raw`\item`} ${latexEscape(q.prompt)}\n`;
        text += `  ${String.raw`\begin{enumerate}[label=\Alph*.]`}\n`;
        q.choices.forEach(choice => {
          text += `    ${String.raw`\item`} ${latexEscape(choice)}\n`;
        });
        text += `  ${String.raw`\end{enumerate}`}\n`;
      });

      text += String.raw`\end{enumerate}` + "\n\n";
      text += String.raw`\section*{Dap an}` + "\n\n";
      text += String.raw`\begin{enumerate}` + "\n";

      questions.forEach(q => {
        text += `  ${String.raw`\item`} ${letters[q.correctIndex]}\n`;
      });

      text += String.raw`\end{enumerate}`;
      return text;
    }

    function latexOutput(r) {
      return String.raw`\documentclass[12pt]{article}
\usepackage[utf8]{inputenc}
\usepackage[T5]{fontenc}
\usepackage[vietnamese]{babel}
\usepackage{amsmath}
\usepackage{enumitem}
\usepackage{geometry}
\geometry{a4paper, margin=2.2cm}

\begin{document}

${latexSolution(r)}

${latexMcq(r)}

\end{document}`;
    }

    function renderLatexPanel(r) {
      return `
        <div class="panel">
          <h2>Ma LaTeX cho Overleaf</h2>
          <p>Co the bam nut <strong>Chep LaTeX</strong> hoac copy truc tiep noi dung ben duoi de dan vao Overleaf.</p>
          <textarea class="latex-output" readonly spellcheck="false">${htmlEscape(latexOutput(r))}</textarea>
        </div>
      `;
    }

    function htmlEscape(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function metric(label, value) {
      return `<div class="metric"><span>${htmlEscape(label)}</span><strong>${htmlEscape(value)}</strong></div>`;
    }

    function renderSummary(r) {
      const items = [
        metric("Do dai ma", r.n),
        metric("So bit thong tin", r.k),
        metric("h(x)", r.h.display()),
        metric("g(x)", r.valid ? r.g.display() : "Khong hop le")
      ];
      if (r.valid) {
        items.push(metric("d_min", r.minDistance));
        items.push(metric("Phat hien", r.detectableErrors + " loi"));
        items.push(metric("Sua duoc", r.correctableErrors + " loi"));
        items.push(metric("Tu ma nho nhat", r.smallestCodeword.binary(r.n)));
      }
      return `<div class="summary">${items.join("")}</div>`;
    }

    function renderSolution(r) {
      const notices = [];
      if (!r.valid) notices.push(`<div class="notice error">Khong hop le: h(x) khong chia het x^n + 1.</div>`);
      r.warnings.forEach(w => notices.push(`<div class="notice">${htmlEscape(w)}</div>`));

      const divisionRows = r.divisionSteps.map((step, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>x^${step.shift}</td>
          <td class="mono">${htmlEscape(step.before)}</td>
          <td class="mono">${htmlEscape(step.subtract)}</td>
          <td class="mono">${htmlEscape(step.after)}</td>
        </tr>
      `).join("");

      const validSteps = r.valid ? `
        <div class="step">
          <h3>Buoc 3. Kiem tra bac da thuc</h3>
          <p>deg h(x) = ${r.h.degree()}, k = ${r.k}; deg g(x) = ${r.g.degree()}, n - k = ${r.n - r.k}.</p>
          <p>${r.warnings.length ? "Co canh bao ve bac da thuc nhu phan tren." : "Cac bac da thuc phu hop voi tham so da nhap."}</p>
        </div>
        <div class="step">
          <h3>Buoc 4. Tim khoang cach ma toi thieu</h3>
          <p>Duyet tat ca ${r.enumeratedCount} thong diep khac 0 co do dai k = ${r.k}. Voi moi thong diep m(x), tinh tu ma c(x) = m(x)g(x), roi lay trong so Hamming.</p>
          <p>Trong so nho nhat tim duoc la d_min = ${r.minDistance}, ung voi tu ma <span class="mono">${r.smallestCodeword.binary(r.n)}</span>.</p>
        </div>
        <div class="step">
          <h3>Ket luan</h3>
          <p>Ma phat hien duoc d_min - 1 = ${r.detectableErrors} loi.</p>
          <p>Ma sua duoc floor((d_min - 1) / 2) = ${r.correctableErrors} loi.</p>
        </div>
      ` : "";

      return `
        ${renderSummary(r)}
        <div class="panel">
          ${notices.join("")}
          <div class="solution">
            <div class="step">
              <h3>Buoc 1. Bieu dien da thuc</h3>
              <p>Tu chuoi nhi phan <span class="mono">${htmlEscape(r.hText)}</span>, suy ra h(x) = <span class="mono">${htmlEscape(r.h.display())}</span>.</p>
              <p>Da thuc can chia la x^n + 1 = <span class="mono">${htmlEscape(r.xnPlusOne.display())}</span>.</p>
            </div>
            <div class="step">
              <h3>Buoc 2. Chia x^n + 1 cho h(x)</h3>
              <p>Thuong thu duoc la g(x) = <span class="mono">${htmlEscape(r.g.display())}</span>, so du la <span class="mono">${htmlEscape(r.remainder.display())}</span>.</p>
              <table>
                <thead>
                  <tr><th>Lan</th><th>Hang thuong</th><th>So du truoc</th><th>Tru XOR</th><th>So du sau</th></tr>
                </thead>
                <tbody>${divisionRows || "<tr><td colspan='5'>Khong co buoc chia.</td></tr>"}</tbody>
              </table>
            </div>
            ${validSteps}
          </div>
        </div>
        <div class="panel">
          <h2>Output nhu chuong trinh C++</h2>
          <pre class="raw-output">${htmlEscape(plainOutput(r))}</pre>
        </div>
        ${renderLatexPanel(r)}
      `;
    }

    function uniqueDistractors(correct, candidates) {
      const values = [String(correct)];
      for (const candidate of candidates.map(String)) {
        if (!values.includes(candidate)) values.push(candidate);
        if (values.length === 4) break;
      }
      while (values.length < 4) values.push(String(Number(values.length) + 17));
      return values;
    }

    function buildQuestion(prompt, correct, candidates) {
      const choices = uniqueDistractors(correct, candidates);
      const correctIndex = choices.indexOf(String(correct));
      return { prompt, choices, correctIndex };
    }

    function mcqQuestions(r) {
      if (!r.valid) {
        return [
          buildQuestion("Ket luan ve bo tham so da nhap la gi?", "Khong hop le", ["Hop le", "Thieu n", "Thieu k"]),
          buildQuestion("Ly do khong hop le la gi?", "h(x) khong chia het x^n + 1", ["k qua lon", "n khong phai so nguyen", "h(x) rong"])
        ];
      }
      return [
        buildQuestion("Da thuc sinh g(x) bang bao nhieu?", r.g.display(), [r.h.display(), r.xnPlusOne.display(), r.remainder.display()]),
        buildQuestion("Khoang cach ma toi thieu d_min bang bao nhieu?", r.minDistance, [r.minDistance + 1, Math.max(0, r.minDistance - 1), r.k]),
        buildQuestion("So loi phat hien duoc bang bao nhieu?", r.detectableErrors, [r.correctableErrors, r.detectableErrors + 1, r.n - r.k]),
        buildQuestion("So loi sua duoc bang bao nhieu?", r.correctableErrors, [r.detectableErrors, r.correctableErrors + 1, Math.max(0, r.correctableErrors - 1)]),
        buildQuestion("Tu ma co trong so nho nhat la gi?", r.smallestCodeword.binary(r.n), [r.g.binary(r.n), r.h.binary(r.n), "0".repeat(r.n)])
      ];
    }

    function renderMcq(r) {
      const questions = mcqQuestions(r);
      const cards = questions.map((q, index) => `
        <div class="question">
          <h3>Cau ${index + 1}. ${htmlEscape(q.prompt)}</h3>
          <div class="choices">
            ${q.choices.map((choice, choiceIndex) => `
              <div class="choice ${choiceIndex === q.correctIndex ? "correct" : ""}">
                <strong>${letters[choiceIndex]}.</strong>
                <span>${htmlEscape(choice)}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
      const key = questions.map((q, index) => `Cau ${index + 1}: ${letters[q.correctIndex]}`).join(" | ");

      return `
        ${renderSummary(r)}
        <div class="panel">
          <h2>Ket qua cho cau trac nghiem</h2>
          <div class="mcq-list">${cards}</div>
          <div class="answer-key"><strong>Dap an:</strong> ${htmlEscape(key)}</div>
        </div>
        <div class="panel">
          <h2>Output tom tat</h2>
          <pre class="raw-output">${htmlEscape(plainOutput(r))}</pre>
        </div>
        ${renderLatexPanel(r)}
      `;
    }

    function renderError(error) {
      document.getElementById("result").innerHTML = `
        <div class="panel">
          <div class="notice error">${htmlEscape(error.message)}</div>
          <div class="empty">Hay kiem tra lai input theo dang: dong 1 la n k, dong 2 la chuoi nhi phan h(x).</div>
        </div>
      `;
      lastPlainOutput = error.message;
      lastLatexOutput = "";
    }

    function syncFieldsFromStandard() {
      try {
        const parsed = parseStandardInput(document.getElementById("standardInput").value);
        document.getElementById("nValue").value = parsed.n;
        document.getElementById("kValue").value = parsed.k;
        document.getElementById("hValue").value = parsed.hText;
      } catch (_) {}
    }

    function syncStandardFromFields() {
      const n = document.getElementById("nValue").value.trim();
      const k = document.getElementById("kValue").value.trim();
      const h = document.getElementById("hValue").value.trim();
      document.getElementById("standardInput").value = `${n} ${k}\n${h}`;
    }

    function calculate() {
      try {
        if (currentInputMode === "standard") syncFieldsFromStandard();
        if (currentInputMode === "fields") syncStandardFromFields();
        const result = solve(readInput());
        lastPlainOutput = plainOutput(result);
        lastLatexOutput = latexOutput(result);
        document.getElementById("result").innerHTML = currentOutputMode === "solution" ? renderSolution(result) : renderMcq(result);
      } catch (error) {
        renderError(error);
      }
    }

    document.getElementById("inputMode").addEventListener("click", event => {
      if (!event.target.matches("button")) return;
      currentInputMode = event.target.dataset.mode;
      document.querySelectorAll("#inputMode button").forEach(button => button.classList.toggle("active", button === event.target));
      if (currentInputMode === "example") {
        const pick = examples[Math.floor(Math.random() * examples.length)];
        document.getElementById("standardInput").value = pick;
        currentInputMode = "standard";
        document.querySelectorAll("#inputMode button").forEach(button => button.classList.toggle("active", button.dataset.mode === "standard"));
      }
      calculate();
    });

    document.getElementById("outputMode").addEventListener("click", event => {
      if (!event.target.matches("button")) return;
      currentOutputMode = event.target.dataset.mode;
      document.querySelectorAll("#outputMode button").forEach(button => button.classList.toggle("active", button === event.target));
      calculate();
    });

    document.getElementById("solveButton").addEventListener("click", calculate);
    document.getElementById("copyButton").addEventListener("click", async () => {
      await navigator.clipboard.writeText(lastPlainOutput);
      document.getElementById("copyButton").textContent = "Da chep";
      setTimeout(() => document.getElementById("copyButton").textContent = "Chep output", 1200);
    });

    document.getElementById("latexButton").addEventListener("click", async () => {
      try {
        if (!lastLatexOutput) {
          if (currentInputMode === "standard") syncFieldsFromStandard();
          if (currentInputMode === "fields") syncStandardFromFields();
          const result = solve(readInput());
          lastLatexOutput = latexOutput(result);
        }
        await navigator.clipboard.writeText(lastLatexOutput);
        document.getElementById("latexButton").textContent = "Da chep LaTeX";
        setTimeout(() => document.getElementById("latexButton").textContent = "Chep LaTeX", 1200);
      } catch (error) {
        renderError(error);
      }
    });

    document.getElementById("standardInput").addEventListener("input", () => {
      currentInputMode = "standard";
      document.querySelectorAll("#inputMode button").forEach(button => button.classList.toggle("active", button.dataset.mode === "standard"));
    });
    ["nValue", "kValue", "hValue"].forEach(id => {
      document.getElementById(id).addEventListener("input", () => {
        currentInputMode = "fields";
        document.querySelectorAll("#inputMode button").forEach(button => button.classList.toggle("active", button.dataset.mode === "fields"));
      });
    });

    calculate();
  </script>
</body>
</html>
